name: Testbed Boundary and Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_POSTGRES_BOUNDARY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dranswer_boundary

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dranswer_boundary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dranswer_boundary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser test dependencies
        run: npm ci

      - name: Validate Compose expansion
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Verify Docker build context excludes runtime env files
        run: docker build -f Dockerfile.context-check -t da-drug-context-check .

      - name: Verify service and database boundaries
        run: python tools/verify_testbed_contract.py --scope config

      - name: Check Backend v1.2 OpenAPI drift
        run: python tools/export_backend_v12_openapi.py --check

      - name: Check AI v1.2 chat OpenAPI drift
        run: python tools/export_agent_v12_openapi.py --check

      - name: Check frontend JavaScript syntax
        run: |
          node --check system_app/static/htmx-lite.js
          node --check system_app/static/notifications.js
          node --check system_app/static/notifications/panels.js
          node --check system_app/static/notifications/shared.js

      - name: Run PostgreSQL reader-role boundary gate
        run: python -m pytest -q -p no:cacheprovider tests/test_backend_v12_postgres_boundary.py

      - name: Run full Python regression suite
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Run real-browser UI regression
        run: npm run test:browser

      - name: Upload browser failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ci-failure
          path: artifacts/browser-ci/
          if-no-files-found: ignore

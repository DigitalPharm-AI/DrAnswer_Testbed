<section id="agent-model-panel" class="panel panel-form">
  <div class="panel-header">
    <h2>AI 모델</h2>
    <span class="badge neutral">{{ agent_model_config.provider }}</span>
  </div>

  <form class="stack-form" action="/agent/model-tier" method="post" hx-post="/agent/model-tier">
    <label>모델 등급</label>
    <select name="model_tier">
      <option value="fast" {{ "selected" if agent_model_config.model_tier == "fast" else "" }}>Fast</option>
      <option value="sonnet" {{ "selected" if agent_model_config.model_tier == "sonnet" else "" }}>Sonnet</option>
    </select>
    <p class="muted">{{ agent_model_config.model_id }}</p>
    <button type="submit">적용</button>
  </form>
</section>

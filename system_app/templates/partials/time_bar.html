<div
  id="time-bar"
  class="top-time-bar"
  hx-get="/partials/time-bar"
  hx-trigger="load, every 1s"
  hx-swap="outerHTML">
  <div class="top-time-inner">
    <div class="top-time-copy">
      <div class="top-time-controls">
        <form action="/clock/play" method="post" hx-post="/clock/play">
          <input type="hidden" name="speed_multiplier" value="{{ clock.speed_multiplier if clock.speed_multiplier > 0 else 60 }}">
          <button class="compact-button" type="submit" {% if not simulation_readiness.ready %}disabled{% endif %}>시작</button>
        </form>
        <form action="/clock/pause" method="post" hx-post="/clock/pause">
          <button class="compact-button ghost" type="submit">정지</button>
        </form>
      </div>
      <span class="badge {{ 'run' if clock.is_running else 'pause' }}">
        {{ '재생 중' if clock.is_running else '일시정지' }}
      </span>
      <strong class="top-time-value">{{ clock.current_time.strftime("%Y-%m-%d %H:%M") }}</strong>
      <span class="muted">배속 {{ clock.speed_multiplier }} 분/초</span>
    </div>
  </div>
</div>

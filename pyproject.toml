[project]
name = "medication-adherence-poc"
version = "0.1.0"
description = "Medication reminder POC with FastAPI services and a routed AI agent app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "langchain-aws>=1.0.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "boto3>=1.35.0",
  "openpyxl>=3.1.5",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_app*", "contract_test_server*", "shared*", "system_app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 180
exclude = [
  ".venv",
  "node_modules",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentOps React Dashboard Draft</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --surface: #ffffff;
      --surface-subtle: #f7f7f7;
      --ink: #111111;
      --muted: #636363;
      --line: #d6d6d6;
      --line-strong: #9d9d9d;
      --nav: #151515;
      --gray-900: #1f1f1f;
      --gray-700: #424242;
      --gray-500: #707070;
      --gray-300: #d0d0d0;
      --gray-200: #ededed;
      --gray-100: #f6f6f6;
      --shadow: 0 8px 20px rgba(17, 17, 17, 0.07);
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-weight: 750;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--gray-700);
    }

    button.is-active,
    .primary-action {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    input,
    select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
    }

    .boot-error {
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      line-height: 1.55;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 20px 16px;
      background: var(--nav);
      color: white;
    }

    .brand {
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .brand strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.1rem;
    }

    .brand span,
    .nav-title,
    .side-note {
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.78rem;
      font-weight: 650;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-height: 38px;
      padding: 0 10px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: rgba(255, 255, 255, 0.84);
      text-align: left;
    }

    .nav-item.is-active {
      background: rgba(255, 255, 255, 0.16);
      color: white;
    }

    .nav-count {
      min-width: 24px;
      padding: 2px 6px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.14);
      font-size: 0.74rem;
      text-align: center;
    }

    .side-note {
      margin-top: auto;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius);
      line-height: 1.5;
    }

    .main {
      min-width: 0;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 1.68rem;
      line-height: 1.22;
    }

    h2 {
      margin-bottom: 0;
      font-size: 1rem;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 0.92rem;
    }

    .subcopy {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .top-actions,
    .control-row,
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .top-actions {
      justify-content: flex-end;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric,
    .section,
    .registry-item,
    .lane,
    .detail-band {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .metric {
      min-width: 0;
      padding: 13px;
    }

    .metric-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
    }

    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: 1.32rem;
      font-weight: 850;
      line-height: 1;
    }

    .metric-delta {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 750;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(360px, 0.95fr);
      gap: 14px;
      align-items: start;
    }

    .section {
      overflow: hidden;
    }

    .section + .section {
      margin-top: 14px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-subtle);
    }

    .section-body {
      padding: 15px;
    }

    .chip,
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: white;
      color: var(--ink);
      font-weight: 850;
      white-space: nowrap;
    }

    .chip {
      min-height: 30px;
      padding: 4px 10px;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chip.is-active {
      background: var(--gray-200);
      color: var(--ink);
    }

    .tag {
      min-height: 24px;
      padding: 2px 8px;
      font-size: 0.75rem;
    }

    .tag.dark {
      background: var(--ink);
      color: white;
    }

    .tag.soft {
      background: var(--gray-200);
      color: var(--gray-900);
    }

    .tag.muted {
      color: var(--gray-700);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 2px;
      background: var(--gray-500);
    }

    .status-dot.dark {
      background: var(--ink);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 850;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tr.is-selected {
      background: var(--gray-100);
      box-shadow: inset 3px 0 0 var(--ink);
    }

    tr.clickable {
      cursor: pointer;
    }

    tr.clickable:hover {
      background: var(--gray-100);
    }

    .mono {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
    }

    .muted {
      color: var(--muted);
    }

    .workflow-lanes {
      display: grid;
      grid-template-columns: repeat(6, minmax(132px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .lane {
      min-width: 132px;
      overflow: hidden;
      box-shadow: none;
    }

    .lane-title {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .lane-step {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 96px;
      padding: 10px;
      background: white;
    }

    .lane-step span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-band {
      overflow: hidden;
      box-shadow: none;
    }

    .detail-band-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: white;
      font-weight: 850;
    }

    .detail-band-body {
      padding: 12px;
      background: var(--surface-subtle);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 12px;
    }

    .kv-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 850;
    }

    .kv-value {
      overflow-wrap: anywhere;
      font-weight: 750;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-left: 8px;
      padding-left: 14px;
      border-left: 2px solid var(--line);
    }

    .timeline-item {
      position: relative;
      padding: 0 0 14px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      top: 3px;
      left: -20px;
      width: 10px;
      height: 10px;
      border: 2px solid white;
      border-radius: 2px;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--line-strong);
    }

    .timeline-item.done::before {
      background: var(--gray-700);
    }

    .timeline-item.waiting::before {
      background: var(--gray-500);
    }

    .timeline-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 3px;
      font-weight: 850;
    }

    .timeline-text {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .code-block {
      max-height: 240px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #111111;
      color: #f5f5f5;
      font-size: 0.78rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .matrix {
      display: grid;
      grid-template-columns: 1.1fr repeat(5, minmax(68px, 0.7fr));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.82rem;
    }

    .matrix div {
      min-height: 40px;
      padding: 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: white;
    }

    .matrix div:nth-child(6n) {
      border-right: none;
    }

    .matrix .head {
      background: var(--surface-subtle);
      color: var(--muted);
      font-weight: 850;
    }

    .matrix button {
      width: 100%;
      justify-content: flex-start;
      border: none;
      background: transparent;
      text-align: left;
      padding: 0;
      min-height: 0;
    }

    .matrix .allow {
      color: var(--ink);
      font-weight: 900;
    }

    .matrix .defer {
      color: var(--gray-700);
      font-weight: 900;
    }

    .matrix .deny {
      color: var(--gray-500);
      font-weight: 900;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      margin-top: 14px;
    }

    .audit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .audit-row {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      font-size: 0.86rem;
    }

    .audit-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .audit-main strong {
      display: block;
      margin-bottom: 3px;
    }

    .audit-main span {
      color: var(--muted);
      line-height: 1.45;
    }

    .registry-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .registry-item {
      min-width: 0;
      padding: 12px;
      background: var(--surface-subtle);
      box-shadow: none;
      cursor: pointer;
    }

    .registry-item.is-selected {
      background: white;
      box-shadow: inset 3px 0 0 var(--ink);
    }

    .registry-item strong {
      display: block;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .registry-item .registry-copy {
      display: block;
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .drawer {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .drawer-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      color: var(--muted);
      background: var(--surface-subtle);
      text-align: center;
    }

    @media (max-width: 1280px) {
      .status-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .dashboard-grid,
      .bottom-grid {
        grid-template-columns: 1fr;
      }

      .registry-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .side-nav {
        display: block;
      }

      .nav-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 14px;
      }

      .side-note {
        margin-top: 14px;
      }

      .main {
        padding: 14px;
      }

      .topbar {
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .status-strip,
      .kv-grid,
      .registry-list {
        grid-template-columns: 1fr;
      }

      .audit-row {
        grid-template-columns: 1fr;
      }

      .section-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

        inputText: "먹었는데 기록을 깜빡했어요",
        workflow: "dose_taken_repair",
        agent: "Multiturn Chat Agent",
        mode: "sync",
        status: "done",
        statusTone: "pass",
        latency: "1.1s",
        output: "mark_dose_taken success",
        scenarioType: "multiturn_chat",
        syncMode: "sync_tool_execution",
        idempotencyKey: "mark_taken:dose:925",
        contextRefs: "dose_event:925, chat:latest",
        outputContract: "DoseTakenToolResult",
        promptVersion: "chat.v7",
        promptHash: "9f2c",
        modelTier: "fast",
        timeline: [
          ["done", "Dose context found", "0ms", "Dose event present in chat context."],
          ["done", "Tool permission checked", "0.8s", "mark_dose_taken allowed for multiturn chat."],
          ["done", "Tool executed", "1.1s", "Dose event marked taken and audit saved."]
        ],
        workflowSteps: [
          ["Input", "Patient reply", "record correction", "dose context"],
          ["Normalize", "Run Envelope", "dose_event_id", "chat context"],
          ["Route", "Tool repair", "mark dose", "sync"],
          ["Agent", "Multiturn Chat Agent", "prompt: chat.v7", "model: fast"],
          ["Tools", "mark_dose_taken", "executed", "permission allowed"],
          ["Output", "System mutation", "dose taken", "audit saved"]
        ]
      }
    ];

    const queueSeed = [
      { id: "chat_continuation:927", type: "chat_continuation", status: "running", attempts: "1 / 3", worker: "agent-worker-01" },
      { id: "daily_pattern:job:881", type: "daily_pattern", status: "pending", attempts: "0 / 3", worker: "-" },
      { id: "push_message:0f31", type: "push_message", status: "dead", attempts: "3 / 3", worker: "agent-worker-02" }
    ];

    const tools = ["mark dose", "side effect", "AE survey", "policy", "clinician"];
    const toolMatrix = [
      ["Multiturn Chat Agent", "allow", "allow", "allow", "defer", "deny"],
      ["Daily Pattern Agent", "deny", "deny", "deny", "defer", "allow"],
      ["Missed Dose Agent", "deny", "allow", "allow", "deny", "allow"],
      ["System Policy Agent", "deny", "deny", "deny", "defer", "deny"]
    ];

    const registries = [
      {
        id: "prompt_registry.xlsx",
        title: "prompt_registry.xlsx",
        body: "agent prompt, version, schema, change reason.",
        sheets: ["agent_prompts", "prompt_versions", "change_log", "execution_logs"]
      },
      {
        id: "workflow_registry.xlsx",
        title: "workflow_registry.xlsx",
        body: "scenario, workflow, sync mode, callback policy.",
        sheets: ["input_scenarios", "workflow_routes", "output_contracts", "callback_policy"]
      },
      {
        id: "agent_tool_registry.xlsx",
        title: "agent_tool_registry.xlsx",
        body: "agent, tool, permission, side effect policy.",
        sheets: ["agents", "tools", "permissions", "side_effect_rules"]
      },
      {
        id: "domain_policy_registry.xlsx",
        title: "domain_policy_registry.xlsx",
        body: "notification policy, boundary, tone policy.",
        sheets: ["notification_policies", "policy_boundaries", "system_policies", "tone_messages"]
      }
    ];

    const audits = [
      ["10:42:18", "Tool permission checked", "lookup_side_effect_info allowed for Multiturn Chat Agent. PHR key present.", "allow"],
      ["10:39:04", "Policy candidate created", "Evening extra_reminders 2 to 1. Patient confirmation notification created.", "confirm"],
      ["10:28:51", "Async callback failed", "push_message callback exceeded retry limit. Dead task opened for triage.", "dead"]
    ];

    function Tag({ children, tone }) {
      const className = tone === "fail" ? "tag dark" : tone === "pending" ? "tag soft" : "tag muted";
      return h("span", { className }, children);
    }

    function Metric({ label, value, delta }) {
      return h("div", { className: "metric" },
        h("div", { className: "metric-label" }, label),
        h("div", { className: "metric-value" }, value, h("span", { className: "metric-delta" }, delta))
      );
    }

    function Section({ id, title, subtitle, action, children }) {
      return h("section", { id, className: "section" },
        h("div", { className: "section-header" },
          h("div", null, h("h2", null, title), subtitle ? h("p", { className: "subcopy" }, subtitle) : null),
          action || null
        ),
        children
      );
    }

    function Nav({ activePanel, setActivePanel, runs, queue }) {
      const items = [
        ["runs", "Runs", runs.length],
        ["queue", "Async Queue", queue.length],
        ["tools", "Tools", tools.length],
        ["audit", "Audit", audits.length],
        ["workflows", "Workflows", 7],
        ["agents", "Agents", 6],
        ["prompts", "Prompts", 24],
        ["excel", "Excel", registries.length]
      ];
      return h("aside", { className: "side-nav", "aria-label": "대시보드 메뉴" },
        h("div", { className: "brand" }, h("strong", null, "AgentOps Console"), h("span", null, "interactive React draft")),
        h("div", { className: "nav-group" },
          h("div", { className: "nav-title" }, "Monitor"),
          items.slice(0, 4).map(([id, label, count]) => h("button", {
            key: id,
            type: "button",
            className: "nav-item " + (activePanel === id ? "is-active" : ""),
            onClick: () => setActivePanel(id)
          }, h("span", null, label), h("span", { className: "nav-count" }, count)))
        ),
        h("div", { className: "nav-group" },
          h("div", { className: "nav-title" }, "Registry"),
          items.slice(4).map(([id, label, count]) => h("button", {
            key: id,
            type: "button",
            className: "nav-item " + (activePanel === id ? "is-active" : ""),
            onClick: () => setActivePanel(id)
          }, h("span", null, label), h("span", { className: "nav-count" }, count)))
        ),
        h("div", { className: "side-note" }, "Run을 클릭하면 오른쪽 상세와 workflow lane이 함께 갱신됩니다. 필터, dead-only, retry, registry 선택도 React state로 움직입니다.")
      );
    }

    function RunTable({ runs, selectedRunId, setSelectedRunId }) {
      if (!runs.length) {
        return h("div", { className: "empty" }, "조건에 맞는 run이 없습니다.");
      }
      return h("div", { className: "table-wrap" },
        h("table", null,
          h("thead", null,
            h("tr", null, ["Run", "Input", "Workflow", "Agent", "Mode", "Status", "Latency", "Output"].map((head) => h("th", { key: head }, head)))
          ),
          h("tbody", null,
            runs.map((run) => h("tr", {
              key: run.id,
              className: "clickable " + (run.id === selectedRunId ? "is-selected" : ""),
              onClick: () => setSelectedRunId(run.id)
            },
              h("td", null, h("span", { className: "mono" }, run.id), h("br"), h("span", { className: "muted" }, "trace " + run.trace)),
              h("td", null, run.input, h("br"), h("span", { className: "muted" }, "\"" + run.inputText + "\"")),
              h("td", null, run.workflow),
              h("td", null, run.agent),
              h("td", null, h(Tag, { tone: run.mode === "async" ? "pending" : "pass" }, run.mode)),
              h("td", null, h(Tag, { tone: run.statusTone }, run.status)),
              h("td", null, run.latency),
              h("td", null, run.output)
            ))
          )
        )
      );
    }

    function WorkflowMap({ run }) {
      return h(Section, {
        id: "workflows",
        title: "Selected Workflow Map",
        subtitle: "선택한 run에 따라 단계별 lane이 갱신됩니다.",
        action: h(Tag, { tone: "pending" }, run.workflow)
      },
        h("div", { className: "section-body" },
          h("div", { className: "workflow-lanes", "aria-label": "워크플로 단계" },
            run.workflowSteps.map((step) => h("div", { key: step[0], className: "lane" },
              h("div", { className: "lane-title" }, step[0]),
              h("div", { className: "lane-step" },
                h("strong", null, step[1]),
                h("span", null, step[2]),
                h("span", null, step[3])
              )
            ))
          )
        )
      );
    }

    function RunDetail({ run, showPrompt, setShowPrompt }) {
      const prompt = {
        agent: run.agent,
        workflow_id: run.workflow,
        prompt_version_id: run.promptVersion,
        prompt_hash: run.promptHash,
        model_tier: run.modelTier,
        context: {
          scenario_type: run.scenarioType,
          sync_mode: run.syncMode,
          context_refs: run.contextRefs,
          idempotency_key: run.idempotencyKey
        },
        required_output: run.outputContract
      };
      return h(Section, {
        title: "Run Detail",
        subtitle: "선택된 실행의 입력, 맥락, 프롬프트, 결과를 함께 봅니다.",
        action: h(Tag, { tone: run.statusTone }, run.status)
      },
        h("div", { className: "section-body right-stack" },
          h("div", { className: "detail-band" },
            h("div", { className: "detail-band-header" }, "Run Envelope", h("span", { className: "mono" }, run.trace)),
            h("div", { className: "detail-band-body" },
              h("div", { className: "kv-grid" },
                [
                  ["scenario_type", run.scenarioType],
                  ["workflow_id", run.workflow],
                  ["sync_mode", run.syncMode],
                  ["idempotency_key", run.idempotencyKey],
                  ["context_refs", run.contextRefs],
                  ["output_contract", run.outputContract]
                ].map(([label, value]) => h("div", { key: label },
                  h("div", { className: "kv-label" }, label),
                  h("div", { className: "kv-value" }, value)
                ))
              )
            )
          ),
          h("div", { className: "detail-band" },
            h("div", { className: "detail-band-header" }, "Execution Timeline", h("span", { className: "muted" }, "live draft")),
            h("div", { className: "detail-band-body" },
              h("div", { className: "timeline" },
                run.timeline.map((item) => h("div", { key: item[1], className: "timeline-item " + item[0] },
                  h("div", { className: "timeline-title" }, h("span", null, item[1]), h("span", { className: "muted" }, item[2])),
                  h("div", { className: "timeline-text" }, item[3])
                ))
              )
            )
          ),
          h("div", { className: "detail-band" },
            h("div", { className: "detail-band-header" },
              "Prompt and Context Snapshot",
              h("button", { type: "button", onClick: () => setShowPrompt(!showPrompt) }, showPrompt ? "Hide" : "Show")
            ),
            showPrompt ? h("div", { className: "detail-band-body" },
              h("pre", { className: "code-block" }, JSON.stringify(prompt, null, 2))
            ) : null
          )
        )
      );
    }

    function QueueTable({ queue, retryTask }) {
      return h(Section, {
        id: "queue",
        title: "Async Queue",
        subtitle: "agent_async_tasks와 worker heartbeat를 운영자가 보는 영역입니다.",
        action: h(Tag, { tone: "pending" }, queue.filter((item) => item.status !== "done").length + " active")
      },
        h("div", { className: "section-body" },
          h("div", { className: "table-wrap" },
            h("table", null,
              h("thead", null, h("tr", null, ["Request", "Type", "Status", "Attempts", "Worker", "Action"].map((head) => h("th", { key: head }, head)))),
              h("tbody", null,
                queue.map((item) => h("tr", { key: item.id },
                  h("td", null, h("span", { className: "mono" }, item.id)),
                  h("td", null, item.type),
                  h("td", null, h(Tag, { tone: item.status === "dead" ? "fail" : item.status === "done" ? "pass" : "pending" }, item.status)),
                  h("td", null, item.attempts),
                  h("td", null, item.worker),
                  h("td", null, h("button", {
                    type: "button",
                    disabled: item.status !== "dead",
                    onClick: () => retryTask(item.id)
                  }, "Retry"))
                ))
              )
            )
          )
        )
      );
    }

    function ToolMatrix({ selectedTool, setSelectedTool }) {
      return h(Section, {
        id: "tools",
        title: "Agent and Tool Permission Matrix",
        subtitle: "셀을 누르면 어떤 agent/tool 권한인지 아래에 표시됩니다.",
        action: h(Tag, { tone: "pass" }, "registry healthy")
      },
        h("div", { className: "section-body" },
          h("div", { className: "matrix", role: "table", "aria-label": "에이전트 툴 권한 매트릭스" },
            h("div", { className: "head" }, "Agent"),
            tools.map((tool) => h("div", { key: tool, className: "head" }, tool)),
            toolMatrix.flatMap((row) => [
              h("div", { key: row[0] }, row[0]),
              ...row.slice(1).map((value, index) => h("div", { key: row[0] + tools[index] },
                h("button", {
                  type: "button",
                  className: value,
                  onClick: () => setSelectedTool({ agent: row[0], tool: tools[index], permission: value })
                }, value)
              ))
            ])
          ),
          selectedTool ? h("div", { className: "drawer" },
            h("strong", null, selectedTool.agent + " / " + selectedTool.tool),
            h("p", { className: "subcopy" }, "permission = " + selectedTool.permission + ". defer는 환자/운영자 확인 전에는 실제 mutation을 하지 않는 설계입니다.")
          ) : null
        )
      );
    }

    function AuditLog() {
      return h(Section, {
        id: "audit",
        title: "Audit Log",
        subtitle: "정책 변경, tool side effect, 사용자 확인, 실패 재시도를 추적합니다.",
        action: h(Tag, { tone: "pass" }, "append only")
      },
        h("div", { className: "section-body" },
          h("div", { className: "audit-list" },
            audits.map((item) => h("div", { key: item[0] + item[1], className: "audit-row" },
              h("span", { className: "mono" }, item[0]),
              h("div", { className: "audit-main" }, h("strong", null, item[1]), h("span", null, item[2])),
              h(Tag, { tone: item[3] === "dead" ? "fail" : item[3] === "confirm" ? "pending" : "pass" }, item[3])
            ))
          )
        )
      );
    }

    function RegistryPanel({ selectedRegistryId, setSelectedRegistryId }) {
      const selected = registries.find((item) => item.id === selectedRegistryId) || registries[0];
      return h(Section, {
        id: "excel",
        title: "Registry and Excel Files",
        subtitle: "Excel은 운영 로그가 아니라 사람이 고치는 설정 원장으로 둡니다.",
        action: h(Tag, { tone: "pass" }, registries.length + " workbooks")
      },
        h("div", { className: "section-body" },
          h("div", { className: "registry-list" },
            registries.map((item) => h("button", {
              key: item.id,
              type: "button",
              className: "registry-item " + (selected.id === item.id ? "is-selected" : ""),
              onClick: () => setSelectedRegistryId(item.id)
            }, h("strong", null, item.title), h("span", { className: "registry-copy" }, item.body)))
          ),
          h("div", { className: "drawer" },
            h("strong", null, selected.title + " sheets"),
            h("div", { className: "drawer-list" },
              selected.sheets.map((sheet) => h(Tag, { key: sheet, tone: "pass" }, sheet))
            )
          )
        )
      );
    }

    function App() {
      const [runs, setRuns] = useState(initialRuns);
      const [selectedRunId, setSelectedRunId] = useState(initialRuns[0].id);
      const [filter, setFilter] = useState("all");
      const [query, setQuery] = useState("");
      const [queue, setQueue] = useState(queueSeed);
      const [showPrompt, setShowPrompt] = useState(true);
      const [selectedTool, setSelectedTool] = useState(null);
      const [selectedRegistryId, setSelectedRegistryId] = useState(registries[0].id);
      const [activePanel, setActivePanel] = useState("runs");
      const [lastUpdated, setLastUpdated] = useState("14:58:00");

      const filteredRuns = useMemo(() => {
        const needle = query.trim().toLowerCase();
        return runs.filter((run) => {
          const filterOk =
            filter === "all" ||
            (filter === "sync" && run.mode === "sync") ||
            (filter === "async" && run.mode === "async") ||
            (filter === "failed" && (run.status === "dead" || run.statusTone === "fail"));
          const queryOk = !needle || [run.id, run.input, run.inputText, run.workflow, run.agent, run.output].join(" ").toLowerCase().includes(needle);
          return filterOk && queryOk;
        });
      }, [runs, filter, query]);

      const selectedRun = runs.find((run) => run.id === selectedRunId) || filteredRuns[0] || runs[0];

      function addScenario() {
        const nextIndex = runs.length + 1;
        const newRun = {
          ...initialRuns[0],
          id: "run_draft_" + String(nextIndex).padStart(2, "0"),
          trace: "draft",
          input: "새 시나리오",
          inputText: "운영자가 추가한 테스트 입력",
          workflow: "draft_workflow",
          status: "draft",
          statusTone: "pending",
          latency: "not run",
          output: "설계 검토 대기",
          timeline: [["waiting", "Draft created", "now", "This scenario can later become a real workflow registry row."]]
        };
        setRuns([newRun, ...runs]);
        setSelectedRunId(newRun.id);
      }

      function retryTask(id) {
        setQueue(queue.map((item) => item.id === id ? { ...item, status: "pending", attempts: "0 / 3", worker: "-" } : item));
      }

      function refresh() {
        const now = new Date();
        setLastUpdated(now.toLocaleTimeString("ko-KR", { hour12: false }));
      }

      const counts = {
        active: runs.filter((run) => !["done", "dead"].includes(run.status)).length,
        pending: queue.filter((item) => ["pending", "running"].includes(item.status)).length,
        dead: queue.filter((item) => item.status === "dead").length,
        prompts: new Set(runs.map((run) => run.promptVersion).filter((value) => value !== "n/a")).size
      };

      return h("div", { className: "app-shell" },
        h(Nav, { activePanel, setActivePanel, runs, queue }),
        h("main", { className: "main" },
          h("header", { className: "topbar" },
            h("div", null,
              h("p", { className: "eyebrow" }, "Operations Dashboard"),
              h("h1", null, "인풋, 워크플로, 에이전트, 툴, 프롬프트, 감사 로그를 인터랙티브하게 추적"),
              h("p", { className: "subcopy" }, "동기 응답과 비동기 작업을 같은 run 단위로 묶고, 선택한 실행의 전체 판단 흐름을 오른쪽에서 갱신합니다.")
            ),
            h("div", { className: "top-actions" },
              h("button", { type: "button", onClick: refresh }, "Refresh"),
              h("button", { type: "button", onClick: () => setFilter("failed") }, "Dead only"),
              h("button", { type: "button", onClick: () => window.print() }, "Export"),
              h("button", { type: "button", className: "primary-action", onClick: addScenario }, "New scenario")
            )
          ),
          h("section", { className: "status-strip", "aria-label": "핵심 상태" },
            h(Metric, { label: "Active runs", value: String(counts.active), delta: "+ draftable" }),
            h(Metric, { label: "Async pending", value: String(counts.pending), delta: "queue" }),
            h(Metric, { label: "Dead tasks", value: String(counts.dead), delta: "retryable" }),
            h(Metric, { label: "Tool success", value: "97%", delta: "sample" }),
            h(Metric, { label: "Prompt versions", value: String(counts.prompts), delta: "loaded" }),
            h(Metric, { label: "Last updated", value: lastUpdated, delta: "local" })
          ),
          h("div", { className: "dashboard-grid" },
            h("div", null,
              h(Section, {
                id: "runs",
                title: "Run Stream",
                subtitle: "행을 클릭하면 오른쪽 상세와 workflow map이 바뀝니다.",
                action: h("div", { className: "filter-row" },
                  ["all", "sync", "async", "failed"].map((item) => h("button", {
                    key: item,
                    type: "button",
                    className: "chip " + (filter === item ? "is-active" : ""),
                    onClick: () => setFilter(item)
                  }, h("span", { className: "status-dot " + (item === "failed" ? "dark" : "") }), item)),
                  h("input", {
                    type: "search",
                    value: query,
                    placeholder: "run, agent, workflow 검색",
                    onChange: (event) => setQuery(event.target.value)
                  })
                )
              }, h(RunTable, { runs: filteredRuns, selectedRunId: selectedRun.id, setSelectedRunId })),
              h(WorkflowMap, { run: selectedRun }),
              h(ToolMatrix, { selectedTool, setSelectedTool })
            ),
            h("aside", { className: "right-stack" },
              h(RunDetail, { run: selectedRun, showPrompt, setShowPrompt }),
              h(QueueTable, { queue, retryTask })
            )
          ),
          h("div", { className: "bottom-grid" },
            h(AuditLog),
            h(RegistryPanel, { selectedRegistryId, setSelectedRegistryId })
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
